# Runs on sapserver next to the n8n Cloudflare tunnel, which routes
# vaultcraft.sapcorp.eu -> http://vaultcraft-mcp:8787. No port is published on the host.
services:
  vaultcraft-mcp:
    build: .
    container_name: vaultcraft-mcp
    restart: unless-stopped
    read_only: true
    cpus: 0.5
    mem_limit: 256m
    env_file:
      - path: .env
        required: false
    networks: [n8n_default]
    logging:
      driver: json-file
      # Usage lines (~700 KB/day) are counted by scripts/usage.sh; 10 x 10 MB keeps months.
      options: { max-size: "10m", max-file: "10" }

networks:
  n8n_default:
    external: true
